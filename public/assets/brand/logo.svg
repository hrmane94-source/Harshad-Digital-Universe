<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbital Diamond / Shield Structure -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="url(#shieldGrad)" stroke="url(#brandGrad)" stroke-width="2.5" />
  
  <!-- Subtle Internal Orbital Ring -->
  <circle cx="50" cy="50" r="32" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="50" cy="50" r="42" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 8" opacity="0.3" />

  <!-- Monogram 'H' & 'M' fusion -->
  <path d="M30 32 V68" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M70 32 V68" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M30 46 L50 60 L70 46" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 50 H70" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Luminous focal nodes -->
  <circle cx="50" cy="60" r="3" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="50" cy="6" r="2.5" fill="#00F0FF" />
  <circle cx="90" cy="26" r="2.5" fill="#3B82F6" />
  <circle cx="90" cy="74" r="2.5" fill="#8B5CF6" />
  <circle cx="50" cy="94" r="2.5" fill="#8B5CF6" />
  <circle cx="10" cy="74" r="2.5" fill="#3B82F6" />
  <circle cx="10" cy="26" r="2.5" fill="#00F0FF" />
</svg>