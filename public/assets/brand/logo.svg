<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Editorial Paper Canvas Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#FAF7F2" stroke="#141518" stroke-width="2.5" stroke-opacity="0.2" />

  <!-- Architectural grid marks -->
  <circle cx="16" cy="16" r="3" fill="#1D4ED8" />
  <circle cx="84" cy="84" r="2.5" fill="#EA580C" />
  <line x1="6" y1="26" x2="16" y2="26" stroke="#141518" stroke-width="1" stroke-opacity="0.3" />
  <line x1="84" y1="74" x2="94" y2="74" stroke="#141518" stroke-width="1" stroke-opacity="0.3" />

  <!-- Monogram H Left Stem with Serif Endings -->
  <line x1="28" y1="28" x2="28" y2="72" stroke="#141518" stroke-width="5" stroke-linecap="round" />
  <line x1="23" y1="28" x2="33" y2="28" stroke="#141518" stroke-width="3" stroke-linecap="round" />
  <line x1="23" y1="72" x2="33" y2="72" stroke="#141518" stroke-width="3" stroke-linecap="round" />

  <!-- H Crossbar -->
  <line x1="28" y1="50" x2="48" y2="50" stroke="#141518" stroke-width="4" stroke-linecap="round" />

  <!-- Center Shared Stem -->
  <line x1="48" y1="28" x2="48" y2="72" stroke="#141518" stroke-width="5" stroke-linecap="round" />
  <line x1="43" y1="28" x2="53" y2="28" stroke="#141518" stroke-width="3" stroke-linecap="round" />
  <line x1="43" y1="72" x2="53" y2="72" stroke="#141518" stroke-width="3" stroke-linecap="round" />

  <!-- M Dynamic Chevron in Electric Cobalt -->
  <polyline points="48,32 60,56 72,32" stroke="#1D4ED8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- M Right Stem -->
  <line x1="72" y1="28" x2="72" y2="72" stroke="#141518" stroke-width="5" stroke-linecap="round" />
  <line x1="67" y1="28" x2="77" y2="28" stroke="#141518" stroke-width="3" stroke-linecap="round" />
  <line x1="67" y1="72" x2="77" y2="72" stroke="#141518" stroke-width="3" stroke-linecap="round" />
</svg>
